# Настройки по умолчанию. Пользовательские переопределения —
# %LOCALAPPDATA%\MtsTemplates\settings.toml

# Стоимость одного зарегистрированного шаблона, ₽/мес
template_fee = "2000.00"

# Кандидаты: минимум сообщений и SMS-сегментов в точной сигнатурной группе.
# Выгода шаблона зависит от числа сегментов, а не от числа сообщений.
min_support = 5
min_cluster_segments = 5
min_text_length = 8

# Защита от слишком широких шаблонов: сколько чужих сообщений допускается.
max_foreign_matches = 0
max_w_words = 20
max_d_words = 20
max_word_slots_per_merge = 20
max_literal_cardinality = 3
# Насколько глубоко объединение уточняет хвост шаблона («… готовы» и
# «… готовы DOCTORLIGHT» остаются разными шаблонами).
max_tail_depth = 4

# Нормализация текста при сравнении: delete / space / keep.
# Свёртка ё→е и омоглифов по умолчанию выключена.
punctuation_policy = "delete"
fold_yo = false
fold_homoglyphs = false
sender_case_sensitive = false

# Модель базовой стоимости: "observed" — по фактическим данным, "catalog" — по прайсу
baseline_mode = "observed"

# Для кандидатов учитывать только доставленные сообщения
delivered_only = true

# Тема оформления: system, neo_brutalism, biophilic_glasshouse,
# cassette_futurism, swiss_minimalism, dark_art_deco, ethereal_mesh, lofi_cozy.
# Выбирается в «Настройки → Внешний вид» и сохраняется в settings.toml.
theme = "system"

# Пороги уровней выгоды шаблона, ₽: от «еле выгоден» до «супер выгоден».
# Убыток выделяется слабо-красным цветом и порогов не имеет.
[benefit]
thresholds = ["1", "3000", "10000", "30000", "100000"]
