[project]
name = "mts-templates"
version = "0.1.0"
description = "Анализ SMS-шаблонов и экономической эффективности для МТС-Маркетолога"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastexcel>=0.12",
    "openpyxl>=3.1",
    "polars>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]

[project.scripts]
mts-templates = "mts_templates.presentation.desktop.main:main"
mts-templates-web = "mts_templates.presentation.api.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mts_templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 не применяем: в проекте русские тексты и докстринги.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mts_templates"]

[tool.ruff.lint.per-file-ignores]
# FastAPI объявляет зависимости и загрузку файлов в значениях по умолчанию.
"src/mts_templates/presentation/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.coverage.run]
source = ["mts_templates"]
branch = true
